<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O/X 리딩 워크북 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:820px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .gate{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-muted);}
  .gate a{color:var(--accent); font-weight:700;}

  textarea{
    width:100%; min-height:180px; padding:14px; border:1px solid var(--border-strong); border-radius:10px;
    font-family:var(--font-body); font-size:14px; background:var(--surface); color:var(--text); resize:vertical;
  }
  .row{display:flex; gap:10px; margin-top:10px;}
  button.btn{
    padding:11px 22px; background:var(--accent); color:#fff; border:none; border-radius:8px;
    font-family:var(--font-body); font-size:14.5px; font-weight:700; cursor:pointer;
  }
  button.btn:disabled{opacity:.5;}
  .msg{font-size:13.5px; color:var(--danger); margin-top:10px;}
  .loading{font-size:13.5px; color:var(--text-muted); margin-top:10px;}

  h3.section{font-size:15px; margin:28px 0 12px;}
  .ox-item{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px;
    margin-bottom:8px; display:flex; justify-content:space-between; gap:16px; align-items:center; font-size:14px;
  }
  .ox-answer{font-size:12px; font-weight:800; padding:2px 10px; border-radius:20px; flex-shrink:0;}
  .ox-answer.true{background:#E6ECE1; color:#2F5233;}
  .ox-answer.false{background:var(--danger-soft); color:var(--danger);}

  .count-row{display:flex; gap:20px; margin-top:14px; flex-wrap:wrap;}
  .count-field{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text);}
  .count-field input{width:60px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:6px;
    font-family:var(--font-body); font-size:13.5px; background:var(--surface); color:var(--text);}

  .passage-box{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
    margin-bottom:16px; font-size:13.5px; line-height:1.7; white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>O/X 리딩 워크북</h1></nav>

  <div id="gate" class="gate">로그인이 필요해요. <a href="/">홈으로 가서 로그인하기</a></div>

  <div id="content" style="display:none;">
    <textarea id="passageInput" placeholder="영어 지문을 붙여넣으세요."></textarea>
    <div class="count-row">
      <label class="count-field">한글 O/X 문항 수
        <input type="number" id="koreanCount" value="10" min="1" max="20">
      </label>
      <label class="count-field">영어 O/X 문항 수
        <input type="number" id="englishCount" value="5" min="1" max="20">
      </label>
    </div>
    <div class="row"><button class="btn" id="genBtn">O/X 문제 만들기</button></div>
    <div class="loading" id="loadingMsg" style="display:none;">Gemini가 문제를 만드는 중이에요...</div>
    <div class="msg" id="errorMsg"></div>

    <div id="resultArea"></div>
  </div>
</div>

<script>
async function checkAuth(){
  const res = await fetch('/auth/me', {credentials:'include'});
  if(res.ok){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }
}
checkAuth();

document.getElementById('genBtn').onclick = async () => {
  const passage_text = document.getElementById('passageInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const loading = document.getElementById('loadingMsg');
  errorMsg.textContent = '';
  if(!passage_text){ errorMsg.textContent = '지문을 입력해주세요.'; return; }

  document.getElementById('genBtn').disabled = true;
  loading.style.display = 'block';
  document.getElementById('resultArea').innerHTML = '';

  const ox_korean_count = parseInt(document.getElementById('koreanCount').value, 10) || 10;
  const ox_english_count = parseInt(document.getElementById('englishCount').value, 10) || 5;

  try{
    const res = await fetch('/api/ox', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({passage_text, ox_korean_count, ox_english_count})
    });
    if(!res.ok){ throw new Error((await res.json()).detail || '생성에 실패했어요.'); }
    const data = await res.json();
    render(data.result, data.material_id, data.passage_text);
  }catch(e){
    errorMsg.textContent = e.message;
  }finally{
    loading.style.display = 'none';
    document.getElementById('genBtn').disabled = false;
  }
};

function renderItems(items){
  return (items || []).map(it => `
    <div class="ox-item">
      <span>[${it.num}] ${it.statement}</span>
      <span class="ox-answer ${it.answer}">${it.answer ? 'O' : 'X'}</span>
    </div>`).join('');
}

function render(result, materialId, passageText){
  const box = document.getElementById('resultArea');
  const dlHtml = materialId
    ? `<a href="/api/materials/${materialId}/pdf" style="display:inline-block; margin-bottom:16px; padding:9px 18px; background:var(--accent); color:#fff; text-decoration:none; border-radius:8px; font-size:13.5px; font-weight:700;">PDF 다운로드</a>`
    : '';
  const passageHtml = passageText
    ? `<h3 class="section" style="margin-top:0;">지문</h3><div class="passage-box">${escapeHtml(passageText)}</div>`
    : '';
  box.innerHTML = `
    ${dlHtml}
    ${passageHtml}
    <h3 class="section">한글 O/X (${(result.korean_ox||[]).length}문항)</h3>
    ${renderItems(result.korean_ox)}
    <h3 class="section">영어 O/X (${(result.english_ox||[]).length}문항)</h3>
    ${renderItems(result.english_ox)}
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
